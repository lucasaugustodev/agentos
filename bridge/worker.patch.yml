- id: llm-deepseek
  config:
    # The adapter speaks Messages only and refuses a protocol override; the
    # gateway behind this baseURL answers Messages on /v1/messages.
    baseURL: http://127.0.0.1:17820/v1
    thinking: disabled
    maxTokens: 8192
    defaultContextWindow: 128000
    streamIdleTimeoutMs: 300000
